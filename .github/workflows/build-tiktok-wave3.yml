name: Build Sovtiva original TikTok microfilms
on:
  push:
    paths:
      - 'tools/social/generate_tiktok_wave3.py'
      - '.github/workflows/build-tiktok-wave3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install rendering dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Render 4 original 9:16 MP4 videos and PNG cover assets
        run: |
          command -v ffmpeg
          python tools/social/generate_tiktok_wave3.py
          for f in assets/social/tiktok/wave3/*.mp4; do ffprobe -v error -show_entries stream=width,height,codec_name,duration -of default=noprint_wrappers=1 "$f"; done
      - name: Commit resulting media to public site
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/social/tiktok/wave3
          if git diff --cached --quiet; then
            echo "No new media differences"
          else
            git commit -m "Render original TikTok editorial videos (wave 3)"
            git push
          fi
