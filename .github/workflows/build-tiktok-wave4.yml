name: Build Sovtiva TikTok wave 04 original films
on:
  push:
    paths:
      - 'tools/social/generate_tiktok_wave4.py'
      - '.github/workflows/build-tiktok-wave4.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow, FFmpeg and DejaVu fonts
        run: |
          python -m pip install --disable-pip-version-check pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Render six 9:16 original videos and covers
        run: |
          python tools/social/generate_tiktok_wave4.py
          for f in assets/social/tiktok/wave4/*.mp4; do ffprobe -v error -show_entries stream=width,height,codec_name,duration -of default=noprint_wrappers=1 "$f"; done
      - name: Commit original produced media
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add assets/social/tiktok/wave4
          if git diff --cached --quiet; then
            echo "Media unchanged"
          else
            git commit -m "Render six original Sovtiva TikTok microfilms wave4"
            git push
          fi
