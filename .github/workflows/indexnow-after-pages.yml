name: IndexNow after successful GitHub Pages deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify-indexnow:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the deployed revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3
      - name: Notify IndexNow of changed HTML pages
        env:
          INDEXNOW_KEY: SovtivaIndexNow2026b15e9a7c2d4f
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import urllib.request
          import urllib.error
          import time

          host = 'sovtiva.com'
          key = os.environ['INDEXNOW_KEY']
          key_file = f'{key}.txt'
          if pathlib.Path(key_file).read_text(encoding='utf-8').strip() != key:
              raise SystemExit('IndexNow key file mismatch')
          key_url = f'https://{host}/{key_file}'
          diff = subprocess.run(['git','diff','--name-only','HEAD^','HEAD'],capture_output=True,text=True,check=True).stdout.splitlines()
          # Initial enablement: this commit only changes the workflow; publish
          # the pages from its immediately preceding site release once.
          if diff == ['.github/workflows/indexnow-after-pages.yml']:
              diff = subprocess.run(['git','diff','--name-only','HEAD^^','HEAD^'],capture_output=True,text=True,check=True).stdout.splitlines()
          urls = set()
          for path in diff:
              if path == 'index.html':
                  urls.add(f'https://{host}/')
              elif path.endswith('/index.html'):
                  urls.add(f'https://{host}/' + path[:-10])
              elif path.endswith('.html') and '/' not in path:
                  urls.add(f'https://{host}/' + path)
          if not urls:
              print('No changed public HTML pages; skipping IndexNow')
              sys.exit(0)
          print('Changed URLs:', *sorted(urls), sep='\n- ')
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(key_url,timeout=25) as response:
                      published_key = response.read().decode('utf-8').strip()
                      if published_key != key:
                          raise RuntimeError('Public key file did not match')
                  break
              except Exception as exc:
                  if attempt == 5:
                      raise SystemExit(f'Public key file could not be verified: {exc}')
                  print(f'Waiting for public IndexNow key: {exc}')
                  time.sleep(10)
          body = json.dumps({'host':host,'key':key,'keyLocation':key_url,'urlList':sorted(urls)}).encode('utf-8')
          request = urllib.request.Request('https://api.indexnow.org/indexnow',data=body,headers={'Content-Type':'application/json; charset=utf-8','User-Agent':'Sovtiva-IndexNow/1.0'},method='POST')
          try:
              with urllib.request.urlopen(request,timeout=30) as response:
                  print('IndexNow accepted URL notification: HTTP', response.status)
                  print('Acceptance is not proof of indexing.')
          except urllib.error.HTTPError as exc:
              print('IndexNow HTTP failure:',exc.code,exc.read().decode('utf-8',errors='replace'))
              raise
          PY
