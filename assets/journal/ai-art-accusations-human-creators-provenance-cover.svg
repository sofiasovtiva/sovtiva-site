<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
    <title id="t">The work behind an image</title><desc id="d">Editorial illustration showing a chain from a rough sketch to layers and a signed source record.</desc>
    <rect width="1200" height="630" fill="#F1EEE5"/>
    <text x="60" y="61" font-family="Arial,sans-serif" font-size="18" letter-spacing="4" fill="#763F4B">SOVTIVA / CREATIVE PROVENANCE</text>
    <text x="60" y="132" font-family="Georgia,serif" fill="#0B1923" font-size="55">A polished image tells you</text>
    <text x="60" y="193" font-family="Georgia,serif" fill="#0B1923" font-size="55">very little about its origin.</text>
    <rect x="59" y="240" width="337" height="312" rx="7" fill="#D1E9E8" stroke="#72816A"/>
    <text x="79" y="274" font-family="Arial,sans-serif" fill="#193E47" font-size="17" letter-spacing="2">01 / THE SKETCH</text>
