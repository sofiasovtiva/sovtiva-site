<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The four gates of AI discoverability</title><desc id="desc">A conceptual editorial map: eligible to be found, evidence worth citing, relevant to a question, and a useful next step. No ranking or performance measurement is implied.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a2533"/><stop offset="1" stop-color="#214654"/></linearGradient><linearGradient id="card" x2="1"><stop stop-color="#b9e3e9"/><stop offset="1" stop-color="#e3ece4"/></linearGradient></defs>
  <rect width="1200" height="630" fill="url(#bg)"/><g stroke="#60808b" opacity=".23"><path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200M110 0V630M220 0V630M330 0V630M440 0V630M550 0V630M660 0V630M770 0V630M880 0V630M990 0V630M1100 0V630"/></g>
  <text x="68" y="76" fill="#b7e5ed" font-size="20" font-family="Arial,sans-serif" font-weight="700" letter-spacing="5">SOVTIVA / RESEARCH DESK</text>
  <text x="68" y="146" fill="#f0f6f3" font-size="53" font-family="Arial,sans-serif" font-weight="700">How AI finds a business</text><text x="68" y="185" fill="#bfd4d8" font-size="22" font-family="Arial,sans-serif">Four gates. No secret shortcut.</text>
  <g font-family="Arial,sans-serif">
    <g transform="translate(64 256)"><rect width="248" height="210" rx="18" fill="url(#card)"/><text x="20" y="47" fill="#476d79" font-weight="700" font-size="19">01 / ACCESS</text><text x="20" y="100" fill="#102c39" font-weight="700" font-size="28">Findable</text><text x="20" y="139" fill="#4a646a" font-size="17">crawl · index · link</text><path d="M20 168H225" stroke="#8ea9ac"/></g>
    <g transform="translate(338 256)"><rect width="248" height="210" rx="18" fill="#dce7e0"/><text x="20" y="47" fill="#677c6a" font-weight="700" font-size="19">02 / PROOF</text><text x="20" y="100" fill="#102c39" font-weight="700" font-size="28">Citable</text><text x="20" y="139" fill="#4a646a" font-size="17">original evidence</text><path d="M20 168H225" stroke="#8ea9ac"/></g>
    <g transform="translate(612 256)"><rect width="248" height="210" rx="18" fill="#d3dce6"/><text x="20" y="47" fill="#60758a" font-weight="700" font-size="19">03 / MATCH</text><text x="20" y="100" fill="#102c39" font-weight="700" font-size="28">Relevant</text><text x="20" y="139" fill="#4a646a" font-size="17">buyer · task · market</text><path d="M20 168H225" stroke="#8ea9ac"/></g>
    <g transform="translate(886 256)"><rect width="248" height="210" rx="18" fill="#d6c0ca"/><text x="20" y="47" fill="#8b576c" font-weight="700" font-size="19">04 / ACTION</text><text x="20" y="100" fill="#102c39" font-weight="700" font-size="28">Useful</text><text x="20" y="139" fill="#4a646a" font-size="17">clear next step</text><path d="M20 168H225" stroke="#8ea9ac"/></g>
  </g>
  <text x="68" y="543" fill="#bcd5d9" font-size="19" font-family="Arial,sans-serif">An editorial framework, not an AI ranking formula.</text><text x="68" y="584" fill="#85a7af" font-size="16" font-family="Arial,sans-serif">RESEARCH NOTE / NOVEMBER 2026</text>
</svg>
