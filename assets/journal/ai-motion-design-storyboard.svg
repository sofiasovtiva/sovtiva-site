<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Storyboard before software: the sequence behind a 30-second product video</title>
  <desc id="desc">Original SOVTIVA editorial diagram with four film frames: tension, product reveal, demonstration and call to action.</desc>
  <rect width="1200" height="675" fill="#0B1923"/>
  <circle cx="1110" cy="90" r="180" fill="none" stroke="#72816A" stroke-opacity=".25" stroke-width="1"/>
  <circle cx="1110" cy="90" r="123" fill="none" stroke="#72816A" stroke-opacity=".25" stroke-width="1"/>
  <text x="59" y="64" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#BFE6F0">SOVTIVA / FIELD NOTES</text>
  <text x="57" y="132" font-family="Georgia, 'Times New Roman', serif" font-size="60" fill="#F1EEE5">Storyboard before software.</text>
  <text x="60" y="174" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#AFC6C7">A 30-second SaaS launch film, reduced to four decisions.</text>
  <line x1="60" y1="219" x2="1140" y2="219" stroke="#D1E9E8" stroke-opacity=".45"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(60,253)">
      <rect width="251" height="302" rx="7" fill="#F1EEE5"/>
      <text x="19" y="33" font-size="15" font-weight="700" letter-spacing="2" fill="#763F4B">01 / 00—04s</text>
      <text x="19" y="66" font-size="23" font-weight="700" fill="#0B1923">Create tension</text>
      <rect x="19" y="88" width="213" height="142" rx="5" fill="#0B1923"/>
      <rect x="38" y="110" width="96" height="8" rx="3" fill="#D1E9E8" opacity=".75"/>
      <rect x="38" y="130" width="164" height="7" rx="3" fill="#72816A"/>
      <rect x="38" y="149" width="133" height="7" rx="3" fill="#72816A"/>
      <rect x="38" y="190" width="77" height="20" rx="4" fill="#763F4B"/>
      <path d="M172 184l15 16-7 0-4 8-6-3 4-8z" fill="#BFE6F0"/>
      <text x="19" y="269" font-size="15" fill="#52636B">Name the friction.</text>
    </g>
    <g transform="translate(336,253)">
      <rect width="251" height="302" rx="7" fill="#F1EEE5"/>
      <text x="19" y="33" font-size="15" font-weight="700" letter-spacing="2" fill="#763F4B">02 / 04—11s</text>
      <text x="19" y="66" font-size="23" font-weight="700" fill="#0B1923">Reveal product</text>
      <rect x="19" y="88" width="213" height="142" rx="5" fill="#BFE6F0"/>
      <rect x="42" y="112" width="166" height="94" rx="6" fill="#0B1923"/>
      <circle cx="60" cy="128" r="4" fill="#763F4B"/><circle cx="74" cy="128" r="4" fill="#72816A"/>
      <rect x="57" y="150" width="77" height="9" rx="3" fill="#F1EEE5"/>
      <rect x="57" y="167" width="128" height="5" rx="2" fill="#72816A"/>
      <rect x="57" y="180" width="104" height="5" rx="2" fill="#72816A"/>
      <text x="19" y="269" font-size="15" fill="#52636B">Show the actual UI.</text>
    </g>
    <g transform="translate(612,253)">
      <rect width="251" height="302" rx="7" fill="#F1EEE5"/>
      <text x="19" y="33" font-size="15" font-weight="700" letter-spacing="2" fill="#763F4B">03 / 11—24s</text>
      <text x="19" y="66" font-size="23" font-weight="700" fill="#0B1923">Demonstrate</text>
      <rect x="19" y="88" width="213" height="142" rx="5" fill="#0B1923"/>
      <rect x="38" y="113" width="62" height="88" rx="5" fill="#D1E9E8"/>
      <rect x="46" y="125" width="46" height="7" rx="2" fill="#72816A"/>
      <rect x="46" y="142" width="43" height="33" rx="3" fill="#BFE6F0"/>
      <path d="M110 156h43m-10-9 10 9-10 9" fill="none" stroke="#BFE6F0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="163" y="113" width="49" height="88" rx="5" fill="#72816A"/>
      <path d="m177 156 10 10 14-21" fill="none" stroke="#F1EEE5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="19" y="269" font-size="15" fill="#52636B">One clear transformation.</text>
    </g>
    <g transform="translate(888,253)">
      <rect width="251" height="302" rx="7" fill="#F1EEE5"/>
      <text x="19" y="33" font-size="15" font-weight="700" letter-spacing="2" fill="#763F4B">04 / 24—30s</text>
      <text x="19" y="66" font-size="23" font-weight="700" fill="#0B1923">Ask for action</text>
      <rect x="19" y="88" width="213" height="142" rx="5" fill="#763F4B"/>
      <circle cx="125" cy="129" r="24" fill="none" stroke="#F1EEE5" stroke-width="2"/>
      <path d="M114 129h23m-8-8 8 8-8 8" fill="none" stroke="#F1EEE5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="65" y="174" width="119" height="14" rx="4" fill="#F1EEE5"/>
      <text x="19" y="269" font-size="15" fill="#52636B">One approved CTA.</text>
    </g>
  </g>
  <line x1="60" y1="596" x2="1140" y2="596" stroke="#D1E9E8" stroke-opacity=".35"/>
  <text x="60" y="632" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#D1E9E8">Illustrative storyboard, not a client project or a frame from Sanji's video.</text>
  <text x="1140" y="632" font-family="Arial, Helvetica, sans-serif" text-anchor="end" font-size="17" fill="#BFE6F0">sovtiva.com</text>
</svg>
