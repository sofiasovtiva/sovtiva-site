<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">A practical AI workflow operating model</title>
  <desc id="desc">A six-stage loop from trigger, source and decision to human approval, action and audit, with an exception review loop</desc>
  <rect width="1200" height="520" fill="#F2F2ED"/>
  <text x="55" y="70" font-family="Georgia, serif" font-size="43" fill="#0B1923">One workflow. Six responsibilities.</text>
  <text x="57" y="106" font-family="Arial, sans-serif" font-size="17" fill="#193E47">REFERENCE PATTERN / ADAPT TO YOUR BUSINESS</text>
  <g font-family="Arial, sans-serif" font-weight="700" font-size="19" text-anchor="middle" fill="#0B1923">
    <rect x="52" y="180" width="165" height="107" rx="4" fill="#BFE6F0"/><text x="134" y="222">01 / TRIGGER</text><text x="134" y="247" font-size="14" font-weight="400">Defined event</text>
    <rect x="243" y="180" width="165" height="107" rx="4" fill="#D1E9E8"/><text x="325" y="222">02 / SOURCE</text><text x="325" y="247" font-size="14" font-weight="400">Verified input</text>
    <rect x="434" y="180" width="165" height="107" rx="4" fill="#BFE6F0"/><text x="516" y="222">03 / DECIDE</text><text x="516" y="247" font-size="14" font-weight="400">Rule or model</text>
    <rect x="625" y="180" width="165" height="107" rx="4" fill="#F1EEE5" stroke="#763F4B" stroke-width="2"/><text x="707" y="222">04 / REVIEW</text><text x="707" y="247" font-size="14" font-weight="400">Human if needed</text>
    <rect x="816" y="180" width="165" height="107" rx="4" fill="#D1E9E8"/><text x="898" y="222">05 / ACT</text><text x="898" y="247" font-size="14" font-weight="400">Approved action</text>
    <rect x="1007" y="180" width="141" height="107" rx="4" fill="#BFE6F0"/><text x="1078" y="222">06 / AUDIT</text><text x="1078" y="247" font-size="14" font-weight="400">Proof + errors</text>
  </g>
  <g stroke="#763F4B" stroke-width="2" fill="none"><path d="M217 232H243m-9 -7 9 7 -9 7M408 232H434m-9 -7 9 7 -9 7M599 232H625m-9 -7 9 7 -9 7M790 232H816m-9 -7 9 7 -9 7M981 232H1007m-9 -7 9 7 -9 7"/></g>
  <path d="M1078 302V359H707V304" stroke="#72816A" stroke-width="2" fill="none" stroke-dasharray="6 5"/>
  <text x="875" y="344" font-family="Arial, sans-serif" font-size="15" fill="#193E47">FAILURES / UNCERTAINTY / RETRY</text>
  <path d="M54 407H1148" stroke="#D1E9E8" stroke-width="2"/>
  <text x="56" y="444" font-family="Arial, sans-serif" font-size="18" fill="#193E47">Document the owner, permission, error route and measurable outcome at every stage.</text>
  <text x="56" y="481" font-family="Arial, sans-serif" font-size="13" letter-spacing="2" fill="#763F4B">SOVTIVA / INTELLIGENT WORK, CONSIDERED.</text>
</svg>
