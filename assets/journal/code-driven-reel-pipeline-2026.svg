<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc"><title id="title">One raw video, four accountable production steps</title><desc id="desc">An original Sovtiva editorial diagram showing a source video being transcribed, edited, composed and checked, not a claim of automated functionality</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b2836"/><stop offset="1" stop-color="#183843"/></linearGradient></defs><rect width="1200" height="630" fill="url(#bg)"/><g stroke="#b3dee2" opacity=".14"><path d="M0 95H1200M0 205H1200M0 315H1200M0 425H1200M0 535H1200M100 0V630M300 0V630M500 0V630M700 0V630M900 0V630M1100 0V630"/></g><text x="65" y="75" fill="#a7cdd4" font-family="Arial,sans-serif" font-weight="bold" font-size="21" letter-spacing="4">SOVTIVA RESEARCH / CODE-DRIVEN VIDEO</text><text x="65" y="166" fill="#f7f8f2" font-family="Arial,sans-serif" font-weight="bold" font-size="65" letter-spacing="-3">A reel is a production system.</text><text x="65" y="221" fill="#c8dedf" font-family="Arial,sans-serif" font-size="23">What automation does. What an editor still decides.</text><g font-family="Arial,sans-serif"><rect x="64" y="295" width="254" height="178" rx="17" fill="#245260" stroke="#7fb6ba"/><text x="86" y="331" fill="#b9e8e8" font-size="16">01 / WHISPER.CPP</text><text x="86" y="377" fill="#fff" font-size="29" font-weight="bold">Transcript</text><text x="86" y="413" fill="#d1e6e3" font-size="18">Word timing + review</text><rect x="337" y="295" width="254" height="178" rx="17" fill="#245260" stroke="#7fb6ba"/><text x="359" y="331" fill="#b9e8e8" font-size="16">02 / FFMPEG</text><text x="359" y="377" fill="#fff" font-size="29" font-weight="bold">Edit</text><text x="359" y="413" fill="#d1e6e3" font-size="18">Cuts + sound</text><rect x="610" y="295" width="254" height="178" rx="17" fill="#245260" stroke="#7fb6ba"/><text x="632" y="331" fill="#b9e8e8" font-size="16">03 / REMOTION</text><text x="632" y="377" fill="#fff" font-size="29" font-weight="bold">Compose</text><text x="632" y="413" fill="#d1e6e3" font-size="18">Captions + motion</text><rect x="883" y="295" width="254" height="178" rx="17" fill="#6a3248" stroke="#c38b9c"/><text x="905" y="331" fill="#f5cfde" font-size="16">04 / EDITORIAL QA</text><text x="905" y="377" fill="#fff" font-size="29" font-weight="bold">Approve</text><text x="905" y="413" fill="#f4dce7" font-size="18">Truth + rights + fit</text></g><text x="65" y="566" fill="#bfd8d7" font-family="Arial,sans-serif" font-size="20">Automation saves labor. Trust still needs a person.</text><text x="1135" y="565" fill="#a9e5e4" font-family="Arial,sans-serif" font-size="26" font-weight="bold" text-anchor="end">sovtiva.</text></svg>