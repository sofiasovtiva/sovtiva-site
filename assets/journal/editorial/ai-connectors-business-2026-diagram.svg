<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">The permission boundary — an original Sovtiva editorial illustration</title>
<desc id="desc">A conceptual diagram, not a screenshot or measured outcome. The graphic visually explains a permissions gate between protected data and verified actions.</desc>
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091923"/><stop offset=".6" stop-color="#12343d"/><stop offset="1" stop-color="#10272f"/></linearGradient><pattern id="g" width="60" height="60" patternUnits="userSpaceOnUse"><path d="M60 0H0V60" fill="none" stroke="#b5d8d0" stroke-width=".7" opacity=".09"/></pattern><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#bce9de"/><stop offset="1" stop-color="#528b93"/></linearGradient></defs>
