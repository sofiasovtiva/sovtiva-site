<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">The AI character business model: from original idea to measurable sponsorship</title><desc id="desc">A five-stage editorial diagram: original character IP; rights-cleared episodes; audience trust; brand partnership; verified outcomes.</desc>
<rect width="1200" height="675" fill="#F1EEE5"/>
<rect x="36" y="36" width="1128" height="603" rx="8" fill="#0B1923"/>
<path d="M71 101H1129" stroke="#72816A" stroke-width="2"/>
<text x="72" y="79" fill="#BFE6F0" font-family="Arial,sans-serif" font-size="20" letter-spacing="3">SOVTIVA / CREATIVE ECONOMY</text>
<text x="74" y="164" fill="#F1EEE5" font-family="Georgia,serif" font-size="50">A character is not the business.</text>
<text x="74" y="214" fill="#F1EEE5" font-family="Georgia,serif" font-size="50">The relationship around it can be.</text>
<path d="M78 284H1124" stroke="#35515B" stroke-width="2"/>
<g font-family="Arial,sans-serif" font-size="20" fill="#F1EEE5">
<rect x="78" y="337" width="180" height="147" rx="4" fill="#193E47"/>
<rect x="293" y="337" width="180" height="147" rx="4" fill="#193E47"/>
<rect x="508" y="337" width="180" height="147" rx="4" fill="#763F4B"/>
<rect x="723" y="337" width="180" height="147" rx="4" fill="#193E47"/>
<rect x="938" y="337" width="180" height="147" rx="4" fill="#193E47"/>
<text x="97" y="370" fill="#BFE6F0" font-size="16">01 / CREATE</text><text x="97" y="407">Original</text><text x="97" y="436">character IP</text>
<text x="312" y="370" fill="#BFE6F0" font-size="16">02 / PRODUCE</text><text x="312" y="407">Rights-cleared</text><text x="312" y="436">episodes</text>
<text x="527" y="370" fill="#F1EEE5" font-size="16">03 / EARN</text><text x="527" y="407">Recognizable</text><text x="527" y="436">audience trust</text>
<text x="742" y="370" fill="#BFE6F0" font-size="16">04 / PARTNER</text><text x="742" y="407">Sponsored</text><text x="742" y="436">creative brief</text>
<text x="957" y="370" fill="#BFE6F0" font-size="16">05 / PROVE</text><text x="957" y="407">Measured</text><text x="957" y="436">results</text>
</g>
<g stroke="#72816A" stroke-width="2" fill="none"><path d="M260 408h26m-9-7 9 7-9 7"/><path d="M475 408h26m-9-7 9 7-9 7"/><path d="M690 408h26m-9-7 9 7-9 7"/><path d="M905 408h26m-9-7 9 7-9 7"/></g>
<text x="78" y="553" fill="#BFE6F0" font-family="Arial,sans-serif" font-size="19">Brand deal ≠ guaranteed reach. Platform payouts ≠ business model.</text>
<text x="78" y="590" fill="#A5B9BD" font-family="Arial,sans-serif" font-size="16">Every step requires consent, originality, disclosure and a human sign-off.</text>
</svg>