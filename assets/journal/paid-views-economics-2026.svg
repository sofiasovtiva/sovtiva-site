<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">The difference between views and earnings</title><desc id="desc">Original Sovtiva editorial diagram showing illustrative gross payouts at a 1.0875 dollars per thousand eligible views rate, before costs and campaign restrictions.</desc><rect width="1200" height="630" fill="#102d3a"/><path d="M0 510L1200 410V630H0Z" fill="#1c404c"/><text x="65" y="79" fill="#acd0d2" font-family="Arial,sans-serif" font-weight="bold" font-size="22" letter-spacing="4">SOVTIVA RESEARCH / REWARD ECONOMICS</text><text x="65" y="173" fill="#f5f7f3" font-family="Arial,sans-serif" font-weight="bold" font-size="70" letter-spacing="-3">100,000 views ≈ $109.</text><text x="65" y="233" fill="#bee8e8" font-family="Arial,sans-serif" font-size="27">At the listed median, before costs. If all views count.</text><g font-family="Arial,sans-serif"><rect x="65" y="303" width="321" height="162" rx="17" fill="#26515b" stroke="#709da1"/><text x="90" y="353" fill="#c6e8e8" font-size="19">10,000 eligible views</text><text x="90" y="414" fill="#fff" font-size="50" font-weight="bold">$10.88</text><rect x="406" y="303" width="321" height="162" rx="17" fill="#26515b" stroke="#709da1"/><text x="431" y="353" fill="#c6e8e8" font-size="19">100,000 eligible views</text><text x="431" y="414" fill="#fff" font-size="50" font-weight="bold">$108.75</text><rect x="747" y="303" width="388" height="162" rx="17" fill="#693349" stroke="#ac7b91"/><text x="772" y="353" fill="#f0c5d7" font-size="19">Campaign cap or rejection</text><text x="772" y="414" fill="#fff" font-size="43" font-weight="bold">Could be $0</text></g><text x="65" y="548" fill="#b9d0d3" font-family="Arial,sans-serif" font-size="18">Median listed rate across 707 Content Rewards campaigns, Nov 10, 2026. Rates are offers, not creator earnings.</text><text x="1135" y="590" text-anchor="end" fill="#bce8e9" font-family="Arial,sans-serif" font-weight="bold" font-size="27">sovtiva.</text></svg>