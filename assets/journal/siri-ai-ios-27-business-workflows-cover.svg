<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="t d">
    <title id="t">From the phone screen to a checked action</title><desc id="d">An abstract three-stage diagram: see an event, interpret it, review the proposed action.</desc>
    <rect width="1200" height="630" fill="#F1EEE5"/><rect x="27" y="27" width="1146" height="576" rx="12" fill="#0B1923"/>
    <text x="69" y="74" font-family="Arial,sans-serif" fill="#BFE6F0" font-size="17" letter-spacing="4">SOVTIVA / PERSONAL AI</text>
    <text x="70" y="142" font-family="Georgia,serif" fill="#F2F2ED" font-size="49">An assistant can see the screen.</text>
    <text x="70" y="190" font-family="Georgia,serif" fill="#F2F2ED" font-size="43">Who checks the action?</text>
    <g font-family="Arial,sans-serif" font-size="19">
      <rect x="74" y="260" width="269" height="255" rx="12" fill="#193E47"/><text x="96" y="294" fill="#BFE6F0" font-size="16">01  /  ON SCREEN</text>
      <rect x="111" y="317" width="196" height="150" rx="18" fill="#E1EBE7"/><rect x="167" y="330" width="83" height="10" rx="5" fill="#0B1923" opacity=".25"/>
      <text x="131" y="380" fill="#0B1923" font-size="21">Event: Friday</text><text x="131" y="409" fill="#0B1923" font-size="17">6:30 pm · details</text><path d="M132 436H282" stroke="#72816A" stroke-width="3"/>
      <rect x="467" y="260" width="269" height="255" rx="12" fill="#193E47"/><text x="489" y="294" fill="#BFE6F0" font-size="16">02  /  INTERPRET</text>
      <text x="496" y="372" fill="#F2F2ED" font-size="25">Recognize</text><text x="496" y="405" fill="#F2F2ED" font-size="25">context</text><text x="496" y="446" fill="#BFE6F0" font-size="17">Propose a task</text>
      <rect x="860" y="260" width="269" height="255" rx="12" fill="#763F4B"/><text x="882" y="294" fill="#F2F2ED" font-size="16">03  /  VERIFY</text>
      <rect x="888" y="329" width="211" height="98" rx="8" fill="#F1EEE5"/><text x="904" y="362" fill="#0B1923" font-size="19">Check dates</text><text x="904" y="391" fill="#0B1923" font-size="19">Check recipients</text><text x="889" y="465" fill="#F2F2ED" font-size="18">HUMAN APPROVAL</text>
    </g>
    <g stroke="#72816A" stroke-width="4" fill="none"><path d="M358 393H447M437 383l10 10-10 10"/><path d="M751 393H840M830 383l10 10-10 10"/></g>
    <text x="74" y="563" font-family="Arial,sans-serif" fill="#A3BAC3" font-size="17">SCHEMATIC ONLY / not a screenshot of Apple software</text>
  </svg>