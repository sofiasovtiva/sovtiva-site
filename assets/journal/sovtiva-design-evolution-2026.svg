<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
<title id="title">How Sovtiva's website took shape</title>
<desc id="desc">Original editorial graphic showing a design journey from a cropped, noisy interface to balanced typography, restrained motion and clear paths.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#091923"/><stop offset=".55" stop-color="#102c35"/><stop offset="1" stop-color="#132c34"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#204550"/><stop offset="1" stop-color="#11323e"/></linearGradient>
  <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#badfdb" stroke-opacity=".07" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="630" fill="url(#bg)"/><rect width="1200" height="630" fill="url(#grid)"/>
<path d="M52 48H1147" stroke="#bfd7d0" stroke-opacity=".35"/>
<text x="54" y="39" font-family="Space Grotesk,Arial,sans-serif" font-size="16" font-weight="600" letter-spacing="2.8" fill="#e8f3ee">sovtiva.</text>
<text x="916" y="39" font-family="Space Grotesk,Arial,sans-serif" font-size="10" font-weight="600" letter-spacing="2.2" fill="#a9c7c6">FIELD NOTES / 2026</text>
<text x="56" y="121" font-family="Space Grotesk,Arial,sans-serif" font-size="50" font-weight="500" letter-spacing="-3.6" fill="#f1f4ed">A website is a series</text>
<text x="56" y="177" font-family="Space Grotesk,Arial,sans-serif" font-size="50" font-weight="500" letter-spacing="-3.6" fill="#f1f4ed">of better decisions<tspan fill="#bce2df">.</tspan></text>
<text x="58" y="215" font-family="Space Grotesk,Arial,sans-serif" font-size="14" fill="#bdcfcd">TYPE  /  SPACE  /  MOTION  /  CONTENT</text>
<!-- A deliberately constrained screen -->
<g transform="translate(56 255)">
<rect x="0" y="0" width="304" height="274" rx="8" fill="#10252f" stroke="#7caaa9" stroke-opacity=".6"/>
<path d="M0 35H304" stroke="#6f9693" stroke-opacity=".6"/><circle cx="18" cy="18" r="4" fill="#91b8b3"/><circle cx="32" cy="18" r="4" fill="#91b8b3" opacity=".4"/>
<text x="20" y="71" font-family="Space Grotesk,Arial,sans-serif" font-size="9" fill="#a8c5bf" letter-spacing="1.4">FIRST PASS</text>
<text x="20" y="120" font-family="Georgia,serif" font-weight="bold" font-size="45" letter-spacing="-3" fill="#f1f1df">What brings</text>
<text x="180" y="166" font-family="Georgia,serif" font-weight="bold" font-size="45" letter-spacing="-3" fill="#f1f1df">you here?</text>
<rect x="20" y="191" width="160" height="5" rx="2" fill="#bed1ca" opacity=".25"/><rect x="20" y="204" width="118" height="5" rx="2" fill="#bed1ca" opacity=".25"/>
<rect x="20" y="233" width="122" height="24" rx="2" fill="#29596a"/><rect x="153" y="233" width="122" height="24" rx="2" fill="#29596a"/>
</g>
<path d="M377 385H476" fill="none" stroke="#bdded7" stroke-width="1.2" stroke-opacity=".85"/>
<path d="m462 375 15 10-15 10" fill="none" stroke="#bdded7" stroke-width="1.2"/>
<text x="426" y="368" font-family="Space Grotesk,Arial" font-size="10" letter-spacing="1.5" text-anchor="middle" fill="#c9d3cc">REFINE</text>
<!-- The balanced, interactive final -->
<g transform="translate(493 255)">
<rect x="0" y="0" width="651" height="274" rx="8" fill="url(#card)" stroke="#90bdb9" stroke-opacity=".8"/>
<path d="M0 35H651" stroke="#85aca8" stroke-opacity=".6"/><circle cx="18" cy="18" r="4" fill="#91b8b3"/><circle cx="32" cy="18" r="4" fill="#91b8b3" opacity=".4"/>
<text x="326" y="69" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="9" fill="#b7d3ce" letter-spacing="2">AFTER THE ITERATIONS</text>
<text x="326" y="122" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="39" font-weight="500" letter-spacing="-2.5" fill="#f1f4ed">What brings</text>
<text x="326" y="165" text-anchor="middle" font-family="Space Grotesk,Arial,sans-serif" font-size="39" font-weight="500" letter-spacing="-2.5" fill="#f1f4ed"><tspan font-family="Instrument Serif,Georgia,serif" font-size="45" font-style="italic" fill="#bde7df">you</tspan> here?</text>
<rect x="171" y="185" width="309" height="4" rx="2" fill="#cedcda" opacity=".25"/>
<g fill="#17404a" stroke="#7cacab" stroke-opacity=".45">
<rect x="34" y="208" width="135" height="45" rx="3"/><rect x="183" y="208" width="135" height="45" rx="3"/><rect x="332" y="208" width="135" height="45" rx="3"/><rect x="481" y="208" width="135" height="45" rx="3"/>
</g>
<g font-family="Space Grotesk,Arial,sans-serif" font-size="11" fill="#d3e6e1" letter-spacing=".2">
<text x="50" y="234">Services →</text><text x="199" y="234">Websites →</text><text x="348" y="234">Tools →</text><text x="497" y="234">Explore →</text>
</g>
</g>
<path d="M56 550H1144" stroke="#cde0da" stroke-opacity=".25"/>
<text x="56" y="580" font-family="Space Grotesk,Arial,sans-serif" font-size="13" font-weight="500" fill="#d6e6e0">Less spectacle. Better structure.</text>
<text x="1144" y="580" text-anchor="end" font-family="Space Grotesk,Arial,sans-serif" font-size="12" fill="#a9c9c7">A SOVTIVA DESIGN DIARY</text>
</svg>